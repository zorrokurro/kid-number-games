<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖形規律 | 數字樂園</title>
<link rel="stylesheet" href="../css/style.css?v=11">
</head>
<body class="theme-candy">
<div class="page">
  <div class="pick" id="modePick">
    <button class="btn green" id="m1">🌱 簡單（AB）</button>
    <button class="btn purple" id="m2">🔥 進階（AAB/ABC）</button>
  </div>
  <div class="panel">
    <div class="hint" id="hint"></div>
    <div class="pat-row" id="patRow"></div>
    <div class="pat-opts" id="patOpts"></div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js?v=11"></script>
<script>
const INSTR = '看看隊伍排法的規律，猜猜問號後面是誰！說說看：紅藍紅藍…下一個是誰？';
const SETS = [
  { name: '蟲蟲隊', items: ['🐞', '🐝', '🦋', '🐛'] },
  { name: '水果隊', items: ['🍎', '🍌', '🍇', '🍓'] },
  { name: '圓點隊', items: ['🔴', '🔵', '🟡', '🟢'] }
];
let mode = 1;
let round = 0;
const TOTAL = 8;
let seq = [];      // 規律序列
let shown = [];    // 顯示的（含最後一格 ?）
let answer = '';   // 正確答案
let opts = [];
let locked = false;

function makePattern() {
  const set = pick(SETS);
  let p;
  if (mode === 1) {
    // AB
    const a = pick(set.items);
    let b = pick(set.items);
    while (b === a) b = pick(set.items);
    p = [a, b];
  } else {
    const t = randInt(0, 2);
    const a = pick(set.items);
    let b = pick(set.items);
    while (b === a) b = pick(set.items);
    if (t === 0) p = [a, a, b];        // AAB
    else if (t === 1) p = [a, b, b];   // ABB
    else {
      let c = pick(set.items);
      while (c === a || c === b) c = pick(set.items);
      p = [a, b, c];                   // ABC
    }
  }
  // 顯示 2~3 個完整循環 + 下一格當問號
  const reps = p.length === 2 ? 3 : 2;  // 完整循環次數
  const full = [];
  for (let r = 0; r < reps; r++) full.push(...p);
  const pos = randInt(Math.floor(full.length / 2), full.length - 1); // 問號在後半
  answer = full[pos];
  shown = full.slice(0, pos).concat(['?']);
  seq = p;
}
function newRound() {
  locked = false;
  round++;
  if (round > TOTAL) {
    showWin('你都是規律小達人！共 ' + starN + ' 顆星星！', start);
    return;
  }
  makePattern();
  const row = document.getElementById('patRow');
  row.innerHTML = '';
  shown.forEach(s => {
    const t = document.createElement('div');
    t.className = 'pat-tile' + (s === '?' ? ' q' : '');
    t.textContent = s;
    row.appendChild(t);
  });
  const box = document.getElementById('patOpts');
  box.innerHTML = '';
  opts = shuffle([answer, ...wrongOpts()]);
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'pat-opt';
    b.textContent = o;
    b.addEventListener('click', () => choose(b, o));
    box.appendChild(b);
  });
  document.getElementById('hint').innerHTML = '第 ' + round + ' / ' + TOTAL + ' 題：❓ 裡面應該是誰？';
  const fb = document.getElementById('fb');
  fb.textContent = '';
  fb.className = 'feedback';
  Voice.speak('看看規律，問號後面是誰？');
}
function wrongOpts() {
  const set = SETS.find(s => s.items.includes(answer));
  const others = set.items.filter(x => x !== answer);
  shuffle(others);
  const extra = SETS.filter(s => s !== set).map(s => pick(s.items));
  return shuffle(others.concat(extra)).slice(0, 2);
}
function choose(btn, o) {
  if (locked) return;
  const fb = document.getElementById('fb');
  if (o === answer) {
    locked = true;
    btn.classList.add('ok');
    Sfx.good();
    addStar(1);
    confetti(24);
    const tiles = [...document.querySelectorAll('.pat-tile.q')];
    tiles[0].textContent = answer;
    tiles[0].classList.remove('q');
    tiles[0].classList.add('fill');
    rowWave();
    fb.textContent = '答對了！規律是 ' + seq.join(' ') + ' ' + seq.join(' ') + '…';
    fb.className = 'feedback good';
    Voice.speak('答對了！你發現規律了！');
    setTimeout(newRound, 2000);
  } else {
    Sfx.bad();
    showCross(...elCenter(btn));
    shake(btn);
    fb.textContent = '再看看前面的排法，跟著念一次！';
    fb.className = 'feedback badf';
    Voice.speak('跟著前面的排法念一次，再想想！');
  }
}
function rowWave() {
  const tiles = [...document.querySelectorAll('.pat-tile')];
  tiles.forEach((t, i) => setTimeout(() => {
    t.classList.add('wave');
    setTimeout(() => t.classList.remove('wave'), 420);
  }, i * 90));
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  round = 0;
  newRound();
}
document.getElementById('m1').addEventListener('click', () => { Sfx.click(); mode = 1; document.getElementById('modePick').classList.add('hide'); start(); });
document.getElementById('m2').addEventListener('click', () => { Sfx.click(); mode = 2; document.getElementById('modePick').classList.add('hide'); start(); });
buildHeader('🔁 圖形規律', INSTR);
</script>
</body>
</html>
