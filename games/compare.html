<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瘥?瘥?| ?詨?璅?</title>
<link rel="stylesheet" href="../css/style.css?v=4?v=4">
</head>
<body>
<div class="page">
  <div class="panel">
    <div class="hint" id="hint">?芯???頛?嚗?暺?嚗?/div>
    <div class="cmp-box">
      <div class="cmp-side cmp-left" id="left">
        <div class="cmp-num show" id="numL"></div>
        <div class="cmp-items" id="leftItems"></div>
      </div>
      <div class="cmp-side cmp-right" id="right">
        <div class="cmp-num show" id="numR"></div>
        <div class="cmp-items" id="rightItems"></div>
      </div>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js?v=4?v=4"></script>
<script>
const INSTR = '?芯???頛?嚗?暺?嚗??臭?瘝?靽??臭誑?岫銝甈∴?';
let round = 0;
const TOTAL = 10;
let leftN = 0, rightN = 0;
let locked = false;

function fillSide(box, n, fruit) {
  box.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'cmp-item';
    s.textContent = fruit;
    s.style.transform = 'rotate(' + randInt(-18, 18) + 'deg) scale(' + (0.9 + Math.random() * 0.25) + ')';
    box.appendChild(s);
  }
}
function newRound() {
  locked = false;
  round++;
  if (round > TOTAL) {
    showWin('雿?? ' + starN + ' 憿???', start);
    return;
  }
  const fruit = pick(['??', '??', '??', '??', '??']);
  do {
    leftN = randInt(1, 9);
    rightN = randInt(1, 9);
  } while (leftN === rightN);
  fillSide(document.getElementById('leftItems'), leftN, fruit);
  fillSide(document.getElementById('rightItems'), rightN, fruit);
  document.getElementById('left').className = 'cmp-side cmp-left';
  document.getElementById('right').className = 'cmp-side cmp-right';
  document.getElementById('numL').textContent = leftN;
  document.getElementById('numR').textContent = rightN;
  const fb = document.getElementById('fb');
  fb.textContent = '';
  fb.className = 'feedback';
  document.getElementById('hint').innerHTML = '蝚?' + round + ' / ' + TOTAL + ' 憿??芯???span style="color:#ff5f6f">瘥?憭?/span>嚗?;
  Voice.speak('?芯???頛?嚗?暺?嚗?);
}
function choose(side, n, el) {
  if (locked) return;
  const other = side === 'left' ? rightN : leftN;
  const fb = document.getElementById('fb');
  if (n > other) {
    locked = true;
    el.classList.add('cmp-ok');
    Sfx.good();
    addStar(1);
    fb.textContent = '蝑?鈭?' + (side === 'left' ? '撌阡?' : '?喲?') + '瘥?憭?';
    fb.className = 'feedback good';
    Voice.speak('蝑?鈭?' + (side === 'left' ? '撌阡?' : '?喲?') + '瘥?憭?');
    confetti(24);
    setTimeout(newRound, 1800);
  } else {
    Sfx.bad();
    showCross(...elCenter(el));
    el.classList.add('cmp-bad');
    shake(el);
    fb.textContent = '?銝?喉??臭誑??銝甈∴?';
    fb.className = 'feedback badf';
    Voice.speak('瘥??摮??芸?頛之嚗?閰虫?甈∴?');
    setTimeout(() => {
      el.classList.remove('cmp-bad');
    }, 900);
  }
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  round = 0;
  newRound();
}
buildHeader('?? 瘥?瘥?, INSTR);
document.getElementById('left').addEventListener('click', () => choose('left', leftN, document.getElementById('left')));
document.getElementById('right').addEventListener('click', () => choose('right', rightN, document.getElementById('right')));
start();
</script>
</body>
</html>
