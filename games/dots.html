<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連連看 | 數字樂園</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
<div class="page">
  <div class="panel dots-wrap">
    <svg class="dots-svg" id="svg" viewBox="0 0 700 480"></svg>
    <div class="feedback" id="fb"></div>
    <div class="next-pill" id="nextPill">下一個數字：1</div>
  </div>
</div>
<script src="../js/common.js?v=6"></script>
<script>
const INSTR = '從數字 1 開始，照著 1、2、3 的順序點點點，連出可愛的圖案！';
const PICTURES = [
  {
    name: '房子',
    pts: [[350,70],[540,170],[500,195],[500,400],[200,400],[200,195],[160,170]],
    reveal: '<polygon points="350,70 540,170 160,170" fill="#ff6b6b" opacity="0.95"/>' +
      '<rect x="200" y="195" width="300" height="205" fill="#ffe08a" opacity="0.95"/>' +
      '<rect x="315" y="300" width="80" height="100" fill="#a06a3c" rx="8"/>' +
      '<rect x="230" y="225" width="60" height="60" fill="#8fd8ff" rx="8" stroke="#fff" stroke-width="5"/>' +
      '<rect x="410" y="225" width="60" height="60" fill="#8fd8ff" rx="8" stroke="#fff" stroke-width="5"/>'
  },
  {
    name: '小魚',
    pts: [[160,260],[330,140],[470,190],[590,120],[540,260],[590,400],[470,330],[330,360]],
    reveal: '<polygon points="160,260 330,140 470,190 590,120 540,260 590,400 470,330 330,360" fill="#ff9d54" opacity="0.95"/>' +
      '<polygon points="330,140 470,190 470,330 330,360" fill="#ffa64d" opacity="0.95"/>' +
      '<circle cx="228" cy="228" r="15" fill="#fff"/><circle cx="234" cy="230" r="7" fill="#5a4b8a"/>' +
      '<path d="M245 285 Q275 305 305 290" stroke="#5a4b8a" stroke-width="8" fill="none" stroke-linecap="round"/>' +
      '<circle cx="110" cy="180" r="14" fill="none" stroke="#8fd8ff" stroke-width="5"/>' +
      '<circle cx="90" cy="120" r="10" fill="none" stroke="#8fd8ff" stroke-width="5"/>'
  },
  {
    name: '星星',
    pts: [[350,80],[396,187],[512,198],[424,274],[450,388],[350,328],[250,388],[276,274],[188,198],[304,187]],
    reveal: '<polygon points="350,80 512,198 450,388 350,328 250,388 188,198 396,187" fill="#ffd24d" opacity="0.95"/>' +
      '<polygon points="350,80 450,388 350,328 250,388" fill="#ffb63c" opacity="0.95"/>' +
      '<circle cx="320" cy="235" r="8" fill="#5a4b8a"/><circle cx="380" cy="235" r="8" fill="#5a4b8a"/>' +
      '<path d="M315 275 Q350 305 385 275" stroke="#5a4b8a" stroke-width="9" fill="none" stroke-linecap="round"/>' +
      '<circle cx="298" cy="258" r="10" fill="#ffb3c1" opacity=".8"/><circle cx="402" cy="258" r="10" fill="#ffb3c1" opacity=".8"/>'
  },
  {
    name: '火箭',
    pts: [[350,40],[395,90],[410,300],[480,360],[470,410],[410,390],[350,430],[290,390],[230,410],[220,360],[290,300],[305,90]],
    reveal: '<polygon points="305,90 395,90 410,300 290,300" fill="#e8ecf5" opacity="0.95"/>' +
      '<polygon points="410,300 480,360 470,410 410,390" fill="#ff5f6f" opacity="0.95"/>' +
      '<polygon points="290,300 220,360 230,410 290,390" fill="#ff5f6f" opacity="0.95"/>' +
      '<polygon points="350,40 395,90 305,90" fill="#ff5f6f" opacity="0.95"/>' +
      '<circle cx="350" cy="180" r="26" fill="#8fd8ff" stroke="#fff" stroke-width="5"/>' +
      '<polygon points="320,432 380,432 350,470" fill="#ffc63c" opacity="0.95"/>'
  },
  {
    name: '蝸牛',
    pts: [[309,290],[330,341],[430,360],[530,341],[551,290],[570,220],[551,150],[530,99],[430,80],[330,99],[309,150],[250,180],[180,240],[170,290],[250,320],[280,380],[340,420],[300,435],[235,410]],
    reveal: '<polygon points="309,290 330,341 430,360 530,341 551,290 570,220 551,150 530,99 430,80 330,99 309,150" fill="#ffb347" opacity="0.95"/>' +
      '<circle cx="430" cy="220" r="58" fill="none" stroke="#e28b2d" stroke-width="7" opacity="0.9"/>' +
      '<polygon points="309,150 250,180 180,240 170,290 250,320 280,380 340,420 300,435 235,410 309,290" fill="#c88b4a" opacity="0.95"/>' +
      '<circle cx="188" cy="248" r="11" fill="#fff"/><circle cx="192" cy="250" r="5" fill="#5a4b8a"/>' +
      '<path d="M175 275 Q190 283 205 278" stroke="#5a4b8a" stroke-width="6" fill="none" stroke-linecap="round"/>'
  },
  {
    name: '蝴蝶',
    pts: [[350,120],[375,145],[430,110],[530,60],[610,130],[600,230],[470,270],[580,330],[520,420],[420,360],[365,300],[350,430],[335,300],[280,360],[180,420],[120,330],[230,270],[100,230],[90,130],[270,60]],
    reveal: '<polygon points="375,145 430,110 530,60 610,130 600,230 470,270" fill="#b06ef7" opacity="0.92"/>' +
      '<polygon points="365,300 470,270 580,330 520,420 420,360" fill="#ff8fa3" opacity="0.92"/>' +
      '<polygon points="325,145 270,110 170,60 90,130 100,230 230,270" fill="#a15cf0" opacity="0.92"/>' +
      '<polygon points="335,300 230,270 120,330 180,420 280,360" fill="#ff7fae" opacity="0.92"/>' +
      '<ellipse cx="350" cy="290" rx="17" ry="95" fill="#5a4b8a"/>' +
      '<circle cx="350" cy="122" r="21" fill="#5a4b8a"/>' +
      '<circle cx="343" cy="118" r="4.5" fill="#fff"/><circle cx="357" cy="118" r="4.5" fill="#fff"/>' +
      '<path d="M340 105 Q320 70 300 62" stroke="#5a4b8a" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M360 105 Q380 70 400 62" stroke="#5a4b8a" stroke-width="5" fill="none" stroke-linecap="round"/>'
  }
];
let picIdx = 0;
let step = 1;
let linePts = [];
let svg, poly, revealG;
let done = false;

function drawPicture() {
  done = false;
  step = 1;
  linePts = [];
  svg = document.getElementById('svg');
  const p = PICTURES[picIdx];
  svg.innerHTML = '<polyline id="poly" points="" fill="none" stroke="#ff5f6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>' +
    '<g id="revealG" style="display:none">' + p.reveal + '</g>';
  poly = svg.querySelector('#poly');
  revealG = svg.querySelector('#revealG');
  p.pts.forEach((pt, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('dot-g');
    g.dataset.n = i + 1;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', pt[0]);
    c.setAttribute('cy', pt[1]);
    c.setAttribute('r', 25);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', pt[0]);
    t.setAttribute('y', pt[1] + 9);
    t.textContent = i + 1;
    g.appendChild(c);
    g.appendChild(t);
    g.addEventListener('click', ev => clickDot(g, pt, i + 1, ev));
    svg.appendChild(g);
  });
  document.getElementById('nextPill').textContent = '下一個數字：1';
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'feedback';
  Voice.speak('我們來連' + p.name + '！先點數字 1！');
}
function clickDot(g, pt, n, ev) {
  if (done) return;
  if (n !== step) {
    Sfx.bad();
    showCross(ev.clientX, ev.clientY);
    Voice.speak('先點數字 ' + step + ' 喔！');
    return;
  }
  Sfx.pop();
  g.classList.add('done');
  linePts.push(pt[0] + ',' + pt[1]);
  poly.setAttribute('points', linePts.join(' '));
  const p = PICTURES[picIdx];
  if (n === p.pts.length) {
    done = true;
    linePts.push(p.pts[0][0] + ',' + p.pts[0][1]);
    poly.setAttribute('points', linePts.join(' '));
    revealG.style.display = '';
    Sfx.good();
    addStar(2);
    confetti(40);
    const fb = document.getElementById('fb');
    fb.textContent = '哇！你連出' + p.name + '了！';
    fb.className = 'feedback good';
    Voice.speak('太棒了！你連出' + p.name + '了！');
    setTimeout(() => {
      picIdx++;
      if (picIdx >= PICTURES.length) {
        showWin('全部連完了！共 ' + starN + ' 顆星星！', () => { picIdx = 0; start(); });
      } else {
        Voice.speak('再來連下一個圖案！');
        drawPicture();
      }
    }, 2200);
  } else {
    step++;
    document.getElementById('nextPill').textContent = '下一個數字：' + step;
  }
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  picIdx = 0;
  drawPicture();
}
buildHeader('⭐ 連連看', INSTR);
start();
</script>
</body>
</html>
