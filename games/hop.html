<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>頝唾歲?豢 | ?詨?璅?</title>
<link rel="stylesheet" href="../css/style.css?v=4?v=4">
</head>
<body>
<div class="page">
  <div class="panel">
    <div class="hint" id="hint"></div>
    <div class="hop-track" id="track">
      <div class="hop-frog" id="frog">?</div>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js?v=4?v=4"></script>
<script>
const INSTR = '撠???頝單摮???1???? ??摨??詨?嚗歲摰??澆停??嚗?頝航歲?唬??橘?';
let level = 0;
let next = 1;
let base = 1;
let locked = false;

function buildLevel() {
  next = 1;
  base = level * 10;
  locked = false;
  const track = document.getElementById('track');
  track.querySelectorAll('.hop-stone').forEach(s => s.remove());
  const nums = shuffle(Array.from({ length: 10 }, (_, i) => base + i + 1));
  nums.forEach(n => {
    const s = document.createElement('button');
    s.className = 'hop-stone';
    s.textContent = n;
    s.dataset.n = n;
    s.addEventListener('click', ev => clickStone(s, n, ev));
    track.appendChild(s);
  });
  const frog = document.getElementById('frog');
  frog.style.left = '20px';
  document.getElementById('hint').innerHTML = '蝚?' + (level + 1) + ' / 10 ???折?摨? <span class="num">' + next + '</span>嚗?;
  const fb = document.getElementById('fb');
  fb.textContent = '';
  fb.className = 'feedback';
  Voice.speak('???詨?' + numToCN(base + 1) + '頝喳' + numToCN(base + 10) + '嚗?暺? + numToCN(base + 1) + '嚗?);
}
function clickStone(s, n, ev) {
  if (locked || s.classList.contains('done')) return;
  if (n !== next) {
    Sfx.bad();
    showCross(ev.clientX, ev.clientY);
    s.classList.remove('wiggle');
    void s.offsetWidth;
    s.classList.add('wiggle');
    const fb = document.getElementById('fb');
    fb.textContent = '???詨? ' + next + ' ??';
    fb.className = 'feedback badf';
    Voice.speak('銝??' + numToCN(next) + '??');
    return;
  }
  Sfx.pop();
  s.classList.add('done');
  const frog = document.getElementById('frog');
  frog.style.left = (s.offsetLeft + s.offsetWidth / 2 - 26) + 'px';
  frog.classList.remove('hop');
  void frog.offsetWidth;
  frog.classList.add('hop');
  addStar(1);
  const fb = document.getElementById('fb');
  fb.textContent = '? ' + numToCN(n) + '嚗?;
  fb.className = 'feedback good';
  Voice.speak(numToCN(n) + '嚗?);
  next++;
  if (next > base + 10) {
    locked = true;
    confetti(40);
    Sfx.good();
    setTimeout(() => {
      level++;
      if (level >= 10) {
        showWin('雿?銝?詨銝?曆?嚗 ' + starN + ' 憿???', start);
        return;
      }
      Voice.speak('??嚗??歇蝬?? + numToCN(base + 10) + '鈭?');
      buildLevel();
    }, 2000);
  } else {
    document.getElementById('hint').innerHTML = '蝚?' + (level + 1) + ' / 10 ???折?摨? <span class="num">' + next + '</span>嚗?;
  }
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  level = 0;
  buildLevel();
}
buildHeader('? 頝唾歲?豢', INSTR);
start();
</script>
</body>
</html>
