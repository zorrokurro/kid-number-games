<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點氣球 | 數字樂園</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page">
  <div class="panel">
    <div class="hint" id="hint"></div>
    <button class="btn orange icon" id="pickBtn">🎭 換玩法</button>
    <div class="sky" id="sky"></div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<div class="pick-mask" id="pickMask">
  <div class="win-card" style="font-size: 26px;">
    <div class="big">🎭</div>
    <div>想玩哪一種？</div>
    <div class="row">
      <button class="btn pink" data-m="1">🔁 換數字（8 顆）</button>
      <button class="btn green" data-m="2">🎯 同一個數字（10 顆）</button>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
const INSTR = '選一個玩法：換數字模式，或同一個數字大挑戰！';
const BCOLORS = ['#ff5f6f', '#54a7ff', '#43d19e', '#ffc63c', '#b06ef7', '#ff9d54'];
let target = 0;
let score = 0;
let goal = 8;
let mode = 1;
let spawnTimer = null;
let locked = false;

function setTarget() {
  let n = randInt(1, 10);
  while (n === target) n = randInt(1, 10);
  target = n;
  const h = document.getElementById('hint');
  h.innerHTML = '點爆數字 <span class="num">' + target + '</span> 的氣球！ 🔊';
  h.style.cursor = 'pointer';
  h.onclick = () => Voice.speak('點爆數字 ' + CN_NUM[target] + ' 的氣球！');
  Voice.speak('點爆數字 ' + CN_NUM[target] + ' 的氣球！');
}
function spawn(forceTarget) {
  const sky = document.getElementById('sky');
  if (sky.querySelectorAll('.balloon').length >= 7) return;
  const b = document.createElement('div');
  b.className = 'balloon';
  const num = forceTarget ? target : (Math.random() < 0.4 ? target : randInt(1, 10));
  b.textContent = num;
  b.style.background = BCOLORS[randInt(0, BCOLORS.length - 1)];
  b.style.left = randInt(2, 82) + '%';
  const dur = randInt(16, 24);
  b.style.animationDuration = dur + 's';
  b.style.animationDelay = '0s';
  b.dataset.v = num;
  b.addEventListener('click', e => popBalloon(b, e));
  sky.appendChild(b);
  setTimeout(() => b.remove(), dur * 1000 + 100);
}
function ensureTarget() {
  const sky = document.getElementById('sky');
  const has = [...sky.querySelectorAll('.balloon')].some(el => el.textContent === String(target));
  if (!has) spawn(true);
}
function popBalloon(b, e) {
  if (locked) return;
  const v = parseInt(b.textContent, 10);
  if (v === target) {
    Sfx.pop();
    burst(e.clientX, e.clientY);
    b.classList.add('boomf');
    const fb = document.getElementById('fb');
    score++;
    addStar(1);
    const sky = document.getElementById('sky');
    if (mode === 2) updateHint();
    if (score >= goal) {
      locked = true;
      clearInterval(spawnTimer);
      sky.querySelectorAll('.balloon').forEach(el => el.remove());
      setTimeout(() => showWin('點爆了 ' + goal + ' 顆氣球！共 ' + starN + ' 顆星星！', startLevel), 700);
      return;
    }
    fb.textContent = '✨ 砰！答對了！';
    fb.className = 'feedback good';
    if (mode === 1) setTimeout(() => { setTarget(); spawn(true); }, 1500);
    else spawn(true);
  } else {
    Sfx.bad();
    b.classList.remove('wiggle');
    void b.offsetWidth;
    b.classList.add('wiggle');
    const fb = document.getElementById('fb');
    if (fb) { fb.textContent = '去找數字 ' + target + ' 的氣球！'; fb.className = 'feedback badf'; }
    Voice.speak('找一找，數字 ' + CN_NUM[target] + ' 的氣球！');
  }
  setTimeout(() => b.remove(), 250);
}
function updateHint() {
  const h = document.getElementById('hint');
  if (mode === 2) {
    h.innerHTML = '這關點爆數字 <span class="num">' + target + '</span> 的氣球：<span class="num">' + score + ' / ' + goal + '</span>！';
  }
}
function startLevel() {
  score = 0;
  locked = false;
  clearInterval(spawnTimer);
  const sky = document.getElementById('sky');
  sky.querySelectorAll('.balloon').forEach(el => el.remove());
  const fb = document.getElementById('fb');
  fb.textContent = '';
  fb.className = 'feedback';
  if (mode === 1) {
    setTarget();
  } else {
    target = randInt(1, 10);
    updateHint();
    Voice.speak('這關的數字是' + CN_NUM[target] + '，點爆' + CN_NUM[goal] + '顆就過關！');
  }
  spawn(true);
  spawnTimer = setInterval(() => {
    spawn(false);
    ensureTarget();
  }, 1800);
}
function buildPicker() {
  document.getElementById('pickBtn').addEventListener('click', () => {
    Sfx.click();
    document.getElementById('pickMask').classList.add('show');
  });
  document.querySelectorAll('#pickMask button').forEach(btn => {
    btn.addEventListener('click', () => {
      mode = parseInt(btn.dataset.m, 10);
      goal = mode === 1 ? 8 : 10;
      locked = false;
      document.getElementById('pickMask').classList.remove('show');
      Sfx.click();
      startLevel();
    });
  });
}
buildHeader('🎈 點氣球', INSTR);
buildPicker();
mode = 1;
goal = 8;
startLevel();
</script>
</body>
</html>
