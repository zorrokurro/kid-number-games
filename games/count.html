<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數一數 | 數字樂園</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page">
  <div class="panel">
    <div class="hint" id="hint">數一數有幾隻小魚？</div>
    <div class="fish-box" id="fishBox"></div>
    <div class="answer-row" id="ansRow"></div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
const INSTR = '數一數，有幾隻小魚？點下面的正確答案！也可以點小魚幫忙數唷。';
let round = 0;
const TOTAL = 10;
let lastN = 0;
let locked = false;

function buildFishes(n) {
  const box = document.getElementById('fishBox');
  box.innerHTML = '';
  const kinds = ['🐠', '🐟', '🐡'];
  for (let i = 0; i < n; i++) {
    const f = document.createElement('div');
    f.className = 'fish';
    f.innerHTML = '<span class="tag"></span>' + pick(kinds);
    f.style.filter = 'hue-rotate(' + randInt(0, 320) + 'deg)';
    f.addEventListener('click', () => {
      if (locked) return;
      Sfx.pop();
      if (!f.classList.contains('counted')) {
        f.classList.add('counted');
        const k = box.querySelectorAll('.counted').length;
        f.querySelector('.tag').textContent = k;
      }
    });
    box.appendChild(f);
  }
}
function buildAnswers(n) {
  const row = document.getElementById('ansRow');
  row.innerHTML = '';
  const opts = shuffle([n, ...wrongNums(n, 1, 10, 2)]);
  opts.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'num-btn nb' + (i + 1);
    b.innerHTML = v + '<small>' + CN_NUM[v] + '</small>';
    b.dataset.v = v;
    b.addEventListener('click', () => choose(b, v));
    row.appendChild(b);
  });
}
function choose(btn, v) {
  if (locked) return;
  locked = true;
  const n = lastN;
  const fb = document.getElementById('fb');
  if (v === n) {
    btn.classList.add('ok');
    Sfx.good();
    addStar(1);
    document.querySelectorAll('.fish').forEach((f, i) => setTimeout(() => {
      f.classList.add('jump');
      const t = f.querySelector('.tag');
      t.textContent = i + 1;
      t.style.display = 'flex';
    }, i * 180));
    fb.textContent = '答對了！' + CN_NUM[n] + '隻小魚！';
    fb.className = 'feedback good';
    Voice.speak('答對了！有' + CN_NUM[n] + '隻小魚，好棒！');
    confetti(24);
    setTimeout(next, 1800);
  } else {
    Sfx.bad();
    shake(btn);
    fb.textContent = '再數數看！';
    fb.className = 'feedback badf';
    Voice.speak('再數數看！');
    document.getElementById('fishBox') && shake(document.getElementById('fishBox'));
    setTimeout(() => {
      locked = false;
    }, 500);
  }
}
function next() {
  locked = false;
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'feedback';
  round++;
  if (round > TOTAL) {
    showWin('你收集了 ' + starN + ' 顆星星！', start);
    return;
  }
  let n = randInt(1, 10);
  while (n === lastN) n = randInt(1, 10);
  lastN = n;
  document.getElementById('hint').innerHTML = '第 ' + round + ' / ' + TOTAL + ' 題：數一數有幾隻小魚？';
  buildFishes(n);
  buildAnswers(n);
  Voice.speak('數一數，有幾隻小魚？');
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  round = 0;
  lastN = 0;
  locked = false;
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'feedback';
  next();
}
buildHeader('🐠 數一數', INSTR);
start();
</script>
</body>
</html>
