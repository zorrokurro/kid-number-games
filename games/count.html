<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>?訾???| ?詨?璅?</title>
<link rel="stylesheet" href="../css/style.css?v=4?v=4">
</head>
<body>
<div class="page">
  <div class="panel">
    <div class="hint" id="hint">?訾??豢?撟暸撠?嚗?/div>
    <div class="fish-box" id="fishBox"></div>
    <div class="answer-row" id="ansRow"></div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js?v=4?v=4"></script>
<script>
const INSTR = '?訾??賂??嗾?餃?擳?暺??Ｙ?甇?Ⅱ蝑?嚗??臭誑暺?擳鼠敹?瑯?;
let round = 0;
const TOTAL = 10;
let lastN = 0;
let locked = false;

function buildFishes(n) {
  const box = document.getElementById('fishBox');
  box.innerHTML = '';
  const kinds = ['??', '??', '?'];
  for (let i = 0; i < n; i++) {
    const f = document.createElement('div');
    f.className = 'fish';
    f.innerHTML = '<span class="tag"></span>' + pick(kinds);
    f.style.filter = 'hue-rotate(' + randInt(0, 320) + 'deg)';
    f.addEventListener('click', () => {
      if (locked) return;
      Sfx.pop();
      if (!f.classList.contains('counted')) {
        f.classList.add('counted');
        const k = box.querySelectorAll('.counted').length;
        f.querySelector('.tag').textContent = k;
      }
    });
    box.appendChild(f);
  }
}
function buildAnswers(n) {
  const row = document.getElementById('ansRow');
  row.innerHTML = '';
  const opts = shuffle([n, ...wrongNums(n, 1, 10, 2)]);
  opts.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'num-btn nb' + (i + 1);
    b.innerHTML = v + '<small>' + CN_NUM[v] + '</small>';
    b.dataset.v = v;
    b.addEventListener('click', () => choose(b, v));
    row.appendChild(b);
  });
}
function choose(btn, v) {
  if (locked) return;
  locked = true;
  const n = lastN;
  const fb = document.getElementById('fb');
  if (v === n) {
    btn.classList.add('ok');
    Sfx.good();
    addStar(1);
    document.querySelectorAll('.fish').forEach((f, i) => setTimeout(() => {
      f.classList.add('jump');
      const t = f.querySelector('.tag');
      t.textContent = i + 1;
      t.style.display = 'flex';
    }, i * 180));
    fb.textContent = '蝑?鈭?' + CN_NUM[n] + '?餃?擳?';
    fb.className = 'feedback good';
    Voice.speak('蝑?鈭??? + CN_NUM[n] + '?餃?擳?憟賣?嚗?);
    confetti(24);
    setTimeout(next, 1800);
  } else {
    Sfx.bad();
    showCross(...elCenter(btn));
    shake(btn);
    fb.textContent = '??貊?嚗?;
    fb.className = 'feedback badf';
    Voice.speak('??貊?嚗?);
    document.getElementById('fishBox') && shake(document.getElementById('fishBox'));
    setTimeout(() => {
      locked = false;
    }, 500);
  }
}
function next() {
  locked = false;
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'feedback';
  round++;
  if (round > TOTAL) {
    showWin('雿?? ' + starN + ' 憿???', start);
    return;
  }
  let n = randInt(1, 10);
  while (n === lastN) n = randInt(1, 10);
  lastN = n;
  document.getElementById('hint').innerHTML = '蝚?' + round + ' / ' + TOTAL + ' 憿??訾??豢?撟暸撠?嚗?;
  buildFishes(n);
  buildAnswers(n);
  Voice.speak('?訾??賂??嗾?餃?擳?');
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  round = 0;
  lastN = 0;
  locked = false;
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'feedback';
  next();
}
buildHeader('?? ?訾???, INSTR);
start();
</script>
</body>
</html>
