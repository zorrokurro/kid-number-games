<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>?豢瘞?? | ?詨?璅?</title>
<link rel="stylesheet" href="../css/style.css?v=4?v=4">
</head>
<body>
<div class="page">
  <div class="panel">
    <div class="hint" id="hint"></div>
    <div class="sky" id="sky" style="height: 440px;">
      <div class="count-row" id="row"></div>
      <div class="count-floor"></div>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js?v=4?v=4"></script>
<script>
const INSTR = '??1???? ??摨??除??憭扯頝??賂?';
const ROUNDS = [5, 6, 7, 8, 9, 10];
let roundIdx = 0;
let next = 1;
let total = 0;
let locked = false;

function buildRound(n) {
  next = 1;
  const row = document.getElementById('row');
  row.innerHTML = '';
  const colors = shuffle(BCOLORS.slice());
  shuffle(Array.from({ length: n }, (_, i) => i + 1)).forEach((num, i) => {
    const b = document.createElement('div');
    b.className = 'balloon count-b';
    b.textContent = num;
    b.style.background = colors[i % colors.length];
    b.style.marginTop = randInt(0, 26) + 'px';
    b.style.transform = 'rotate(' + randInt(-8, 8) + 'deg)';
    b.addEventListener('click', () => clickB(b, num));
    row.appendChild(b);
  });
  updateHint();
  const fb = document.getElementById('fb');
  fb.textContent = '';
  fb.className = 'feedback';
  Voice.speak('???詨' + CN_NUM[n] + '嚗?暺摮?嚗?);
}
function updateHint() {
  document.getElementById('hint').innerHTML =
    '蝚?' + (roundIdx + 1) + ' / ' + ROUNDS.length + ' 頛迎??折?摨? <span class="num">' + next + '</span> 嚗歇?詨 ' + (next - 1) + '嚗?;
}
function clickB(b, num) {
  if (locked || b.classList.contains('popped')) return;
  if (num !== next) {
    Sfx.bad();
    showCross(...pos(b));
    b.classList.remove('wiggle');
    void b.offsetWidth;
    b.classList.add('wiggle');
    const fb = document.getElementById('fb');
    fb.textContent = '???詨? ' + next + ' ?除??';
    fb.className = 'feedback badf';
    Voice.speak('???詨?' + CN_NUM[next] + '?除??');
    return;
  }
  Sfx.pop();
  b.classList.add('popped');
  const fb = document.getElementById('fb');
  fb.textContent = '??' + CN_NUM[num] + '嚗撠?嚗?;
  fb.className = 'feedback good';
  Voice.speak(CN_NUM[num] + '嚗?);
  addStar(1);
  burst.call(null, ...pos(b));
  total = num;
  if (next === ROUNDS[roundIdx]) {
    locked = true;
    confetti(40);
    Sfx.good();
    setTimeout(() => {
      locked = false;
      roundIdx++;
      if (roundIdx >= ROUNDS.length) {
        showWin('雿??詨??嚗 ' + starN + ' 憿???', start);
        return;
      }
      Voice.speak(CN_NUM[ROUNDS[roundIdx - 1]] + '?除??憟賣?嚗?銝頛迎?');
      buildRound(ROUNDS[roundIdx]);
    }, 1800);
  } else {
    next++;
    updateHint();
  }
}
function pos(el) {
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  roundIdx = 0;
  locked = false;
  buildRound(ROUNDS[0]);
}
buildHeader('?? ?豢瘞??', INSTR);
start();
</script>
</body>
</html>
