<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花園尋寶 | 數字樂園</title>
<link rel="stylesheet" href="../css/style.css?v=8">
</head>
<body class="theme-garden">
<div class="page">
  <div class="pick" id="modePick">
    <button class="btn green" id="m1">🌱 1~10</button>
    <button class="btn purple" id="m2">🔥 11~20</button>
  </div>
  <div class="panel">
    <div class="hint" id="hint"></div>
    <div class="garden-box" id="gardenBox"></div>
    <div class="chest-row" id="chestRow"></div>
    <div class="feedback" id="fb"></div>
  </div>
</div>
<script src="../js/common.js?v=8"></script>
<script>
const INSTR = '數一數花園裡的蟲蟲，點開裝著答案的寶盒！也可以點點蟲蟲幫忙數唷。';
const GARDEN = [['蝴蝶', ['🦋']], ['蜜蜂', ['🐝']], ['瓢蟲', ['🐞']], ['蝸牛', ['🐌']], ['毛毛蟲', ['🐛']], ['螞蟻', ['🐜']], ['甲蟲', ['🪲']], ['蟋蟀', ['🦗']]];
let mode = 1;
let round = 0;
const TOTAL = 10;
let targetN = 0, targetName = '', locked = false;

function addCreature(kind, isTarget) {
  const box = document.getElementById('gardenBox');
  const f = document.createElement('div');
  f.className = 'fish' + (isTarget ? ' target' : '');
  f.innerHTML = '<span class="tag"></span>' + pick(kind[1]);
  if (mode === 1) f.style.filter = 'hue-rotate(' + randInt(0, 320) + 'deg)';
  f.addEventListener('click', () => {
    if (locked) return;
    Sfx.pop();
    if (!f.classList.contains('counted')) {
      f.classList.add('counted');
      const k = box.querySelectorAll('.counted').length;
      f.querySelector('.tag').textContent = k;
    }
  });
  box.appendChild(f);
}
function newRound() {
  locked = false;
  round++;
  if (round > TOTAL) {
    showWin('你找到所有寶藏了！共 ' + starN + ' 顆星星！', start);
    return;
  }
  const box = document.getElementById('gardenBox');
  box.innerHTML = '';
  document.getElementById('chestRow').innerHTML = '';
  const kind = pick(GARDEN);
  targetName = kind[0];
  if (mode === 1) {
    targetN = round <= 5 ? randInt(3, 6) : randInt(4, 9);
  } else {
    targetN = randInt(11, 20);
  }
  for (let i = 0; i < targetN; i++) addCreature(kind, true);
  if (mode === 1 && round > 5) {
    const others = GARDEN.filter(k => k[0] !== targetName);
    const dKind = pick(others);
    const d = randInt(1, 3);
    for (let i = 0; i < d; i++) addCreature(dKind, false);
  }
  const row = document.getElementById('chestRow');
  const opts = mode === 1
    ? shuffle([targetN, ...wrongNums(targetN, 1, 10, 2)])
    : shuffle([targetN, ...wrongNums(targetN, 11, 20, 2)]);
  opts.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chest';
    b.innerHTML = '<span class="gift">🎁</span><span class="cn">' + v + '</span>';
    b.addEventListener('click', () => choose(b, v));
    row.appendChild(b);
  });
  document.getElementById('hint').innerHTML = '第 ' + round + ' / ' + TOTAL + ' 題：有幾隻<span style="color:#ff5f6f">' + targetName + '</span>？';
  const fb = document.getElementById('fb');
  fb.textContent = '';
  fb.className = 'feedback';
  Voice.speak('數一數，有幾隻' + targetName + '？點開裝著答案的寶盒！');
}
function choose(btn, v) {
  if (locked) return;
  locked = true;
  const fb = document.getElementById('fb');
  if (v === targetN) {
    btn.classList.add('open');
    btn.querySelector('.gift').textContent = '💰';
    Sfx.good();
    addStar(1);
    confetti(26);
    const targets = [...document.querySelectorAll('#gardenBox .fish.target')];
    document.querySelectorAll('#gardenBox .fish:not(.target)').forEach(f => {
      f.classList.remove('counted');
      f.querySelector('.tag').style.display = 'none';
    });
    targets.forEach((f, i) => setTimeout(() => {
      f.classList.add('jump');
      const t = f.querySelector('.tag');
      t.textContent = i + 1;
      t.style.display = 'flex';
    }, i * 170));
    fb.textContent = '答對了！有 ' + targetN + ' 隻' + targetName + '！';
    fb.className = 'feedback good';
    Voice.speak('答對了！有' + numToCN(targetN) + '隻' + targetName + '，好棒！');
    setTimeout(newRound, 2300);
  } else {
    Sfx.bad();
    showCross(...elCenter(btn));
    shake(btn);
    fb.textContent = '再數數看！';
    fb.className = 'feedback badf';
    Voice.speak('再數數看！');
    setTimeout(() => { locked = false; }, 500);
  }
}
function start() {
  starN = 0;
  const e = document.getElementById('starN');
  if (e) e.textContent = '0';
  round = 0;
  locked = false;
  newRound();
}
document.getElementById('m1').addEventListener('click', () => { Sfx.click(); mode = 1; document.getElementById('modePick').classList.add('hide'); start(); });
document.getElementById('m2').addEventListener('click', () => { Sfx.click(); mode = 2; document.getElementById('modePick').classList.add('hide'); start(); });
buildHeader('🦋 花園尋寶', INSTR);
</script>
</body>
</html>
